<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>托管 V2 控制台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="v2-shell">
      <section class="hero-panel">
        <div class="hero-copy">
          <p class="eyebrow" data-text="heroEyebrow"></p>
          <h1 data-text="heroTitle"></h1>
          <p data-text="heroBody"></p>
        </div>
        <div class="hero-metrics" aria-label="系统状态">
          <article>
            <span data-text="metricSurface"></span>
            <strong>V2 Only</strong>
          </article>
          <article>
            <span data-text="metricTenant"></span>
            <strong id="tenant-pill">加载中</strong>
          </article>
          <article>
            <span data-text="metricWorkers"></span>
            <strong id="worker-count">0</strong>
          </article>
          <article>
            <span data-text="metricAudits"></span>
            <strong id="audit-count">0</strong>
          </article>
        </div>
      </section>

      <section class="control-grid">
        <form id="project-form" class="glass-card launch-card">
          <div class="card-head">
            <div>
              <p class="eyebrow" data-text="createEyebrow"></p>
              <h2 data-text="createTitle"></h2>
            </div>
            <span class="status-chip" data-text="tenantScoped"></span>
          </div>
          <label>
            <span data-text="projectName"></span>
            <input name="name" placeholder="hr-ai-platform" required />
          </label>
          <label>
            <span data-text="projectTitle"></span>
            <input name="title" placeholder="企业 HR AI 平台" required />
          </label>
          <label>
            <span data-text="projectPath"></span>
            <input name="project_path" placeholder="E:\ProgramProjects\hr-ai-platform" />
          </label>
          <label>
            <span data-text="automationMode"></span>
            <select name="automation_mode">
              <option value="supervised_auto" data-text="modeSupervised"></option>
              <option value="guided" data-text="modeGuided"></option>
              <option value="full_auto_candidate" data-text="modeFullAuto"></option>
            </select>
          </label>
          <label>
            <span data-text="requirements"></span>
            <textarea
              name="description"
              rows="8"
              placeholder="Must support resume parsing, tenant isolation, SSO, audit logs, quality gates, and release approvals."
              required
            ></textarea>
          </label>
          <button id="create-submit" type="submit" data-text="createSubmit"></button>
        </form>

        <section class="glass-card model-card">
          <div class="card-head">
            <div>
              <p class="eyebrow" data-text="modelEyebrow"></p>
              <h2 data-text="modelTitle"></h2>
            </div>
            <span id="model-chip" class="status-chip">未测试</span>
          </div>
          <form id="model-form" class="model-form">
            <label class="toggle-line">
              <input name="use_mock" type="checkbox" />
              <span data-text="mockMode"></span>
            </label>
            <label>
              <span data-text="providerProfile"></span>
              <select name="provider_profile"></select>
            </label>
            <label>
              <span data-text="apiBase"></span>
              <input name="api_base" placeholder="https://api.example.com/v1" />
            </label>
            <label>
              <span data-text="apiPath"></span>
              <input name="api_path" placeholder="/chat/completions" />
            </label>
            <label>
              <span data-text="modelName"></span>
              <input name="model" placeholder="gpt-4.1" />
            </label>
            <label>
              <span data-text="apiKey"></span>
              <input name="api_key" type="password" placeholder="环境变量优先；保存后不回显" autocomplete="off" />
            </label>
            <div class="model-grid">
              <label>
                <span data-text="wireApi"></span>
                <select name="wire_api">
                  <option value="chat_completions">chat_completions</option>
                  <option value="responses">responses</option>
                </select>
              </label>
              <label>
                <span data-text="timeout"></span>
                <input name="timeout_seconds" type="number" min="1" step="1" />
              </label>
              <label>
                <span data-text="retries"></span>
                <input name="retry_attempts" type="number" min="1" step="1" />
              </label>
              <label>
                <span data-text="maxTokens"></span>
                <input name="max_tokens" type="number" min="1" step="1" />
              </label>
              <label>
                <span data-text="temperature"></span>
                <input name="temperature" type="number" min="0" max="2" step="0.1" />
              </label>
            </div>
            <p class="warning-note" data-text="keyWarning"></p>
            <div class="action-row">
              <button id="save-model-button" type="submit" data-text="saveModel"></button>
              <button id="test-model-button" type="button" class="ghost-button" data-text="testModel"></button>
            </div>
            <div id="model-result" class="inline-result"></div>
          </form>
        </section>

        <section class="glass-card project-card">
          <div class="card-head">
            <div>
              <p class="eyebrow" data-text="projectsEyebrow"></p>
              <h2 data-text="projectsTitle"></h2>
            </div>
            <button id="refresh-button" type="button" class="ghost-button" data-text="refresh"></button>
          </div>
          <div id="project-list" class="project-list"></div>
        </section>

        <section class="glass-card detail-card">
          <div class="card-head">
            <div>
              <p class="eyebrow" data-text="resultEyebrow"></p>
              <h2 id="detail-title" data-text="selectProject"></h2>
            </div>
            <span id="decision-chip" class="status-chip">空闲</span>
          </div>
          <div id="summary-grid" class="summary-grid"></div>
          <div class="action-row">
            <button id="approve-button" type="button" disabled data-text="approveCandidate"></button>
            <button id="apply-button" type="button" class="ghost-button" disabled data-text="applyPatch"></button>
          </div>
        </section>
      </section>

      <section class="evidence-grid">
        <section class="glass-card">
          <div class="card-head compact">
            <h2 data-text="timeline"></h2>
            <span data-text="chiefEvents"></span>
          </div>
          <div id="timeline-list" class="evidence-list"></div>
        </section>
        <section class="glass-card">
          <div class="card-head compact">
            <h2 data-text="agents"></h2>
            <span data-text="attempts"></span>
          </div>
          <div id="agent-list" class="evidence-list"></div>
        </section>
        <section class="glass-card">
          <div class="card-head compact">
            <h2 data-text="patches"></h2>
            <span data-text="gitDiff"></span>
          </div>
          <div id="patch-list" class="evidence-list"></div>
        </section>
        <section class="glass-card">
          <div class="card-head compact">
            <h2 data-text="tests"></h2>
            <span data-text="runtimeProof"></span>
          </div>
          <div id="test-list" class="evidence-list"></div>
        </section>
        <section class="glass-card">
          <div class="card-head compact">
            <h2 data-text="workers"></h2>
            <span data-text="hostedQueue"></span>
          </div>
          <div id="worker-list" class="evidence-list"></div>
        </section>
        <section class="glass-card">
          <div class="card-head compact">
            <h2 data-text="audit"></h2>
            <span data-text="tenantTrail"></span>
          </div>
          <div id="audit-list" class="evidence-list"></div>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
