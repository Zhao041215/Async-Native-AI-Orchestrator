<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V4 自治交付控制台</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="v4-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Dev Orchestrator V4</p>
        <h1>多进程自治交付控制台</h1>
      </div>
      <div class="status-strip">
        <span id="health-pill" class="pill">checking</span>
        <span id="worker-count" class="pill">workers 0</span>
        <button id="refresh" type="button">刷新</button>
      </div>
    </header>

    <section class="grid">
      <form id="project-form" class="panel">
        <div class="panel-title">
          <p class="eyebrow">Create</p>
          <h2>创建并派发项目</h2>
        </div>
        <label>项目名称<input name="name" placeholder="notification-admin"></label>
        <label>项目标题<input name="title" placeholder="企业后台系统"></label>
        <label>技术栈
          <select name="stack_pack">
            <option value="auto">auto</option>
            <option value="php_mysql_single_dir">php_mysql_single_dir</option>
            <option value="nextjs_prisma_postgres">nextjs_prisma_postgres</option>
            <option value="python_fastapi_postgres">python_fastapi_postgres</option>
            <option value="react_node_mysql">react_node_mysql</option>
            <option value="node_express_mysql">node_express_mysql</option>
            <option value="laravel_mysql">laravel_mysql</option>
            <option value="static_spa_api">static_spa_api</option>
          </select>
        </label>
        <label>目标规模
          <select name="target_scale">
            <option value="small">small</option>
            <option value="medium">medium</option>
            <option value="large">large</option>
            <option value="xlarge_100k">xlarge_100k</option>
          </select>
        </label>
        <label>有效 LOC 目标<input name="effective_loc_target" type="number" value="1000" min="100"></label>
        <label>需求描述<textarea name="description" rows="8" placeholder="例如：宝塔部署，PHP + MySQL，包含管理员登录、审计、报表和健康检查。"></textarea></label>
        <button id="create-run" type="submit">创建并运行</button>
      </form>

      <section class="panel">
        <div class="panel-title">
          <p class="eyebrow">Projects</p>
          <h2>项目队列</h2>
        </div>
        <div id="project-list" class="list"></div>
      </section>

      <section class="panel detail">
        <div class="panel-title">
          <p class="eyebrow">Run</p>
          <h2 id="run-title">选择一个项目</h2>
        </div>
        <div id="run-summary" class="summary"></div>
        <h3>Jobs</h3>
        <div id="job-list" class="list compact"></div>
        <h3>Continuation</h3>
        <pre id="continuation"></pre>
        <h3>Artifacts</h3>
        <div id="artifact-list" class="list compact"></div>
      </section>

      <section class="panel">
        <div class="panel-title">
          <p class="eyebrow">Workers</p>
          <h2>进程状态</h2>
        </div>
        <div id="worker-list" class="list compact"></div>
      </section>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
