services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: python run_server.py --host 0.0.0.0 --port 8787
    environment:
      V2_DATABASE_URL: postgresql://orchestrator:orchestrator@postgres:5432/orchestrator
      V2_REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8787:8787"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  worker:
    image: python:3.12-slim
    working_dir: /app
    command: python -c "import time; print('V2 worker boundary ready'); time.sleep(31536000)"
    environment:
      V2_DATABASE_URL: postgresql://orchestrator:orchestrator@postgres:5432/orchestrator
      V2_REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    volumes:
      - v2-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  v2-postgres:
