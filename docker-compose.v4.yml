services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: sh -lc "pip install -r requirements-v4.txt && python run_server.py --api --host 0.0.0.0 --port 8787"
    environment:
      V4_DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8787:8787"
    volumes:
      - .:/app
    depends_on:
      - postgres

  worker-supervisor:
    image: python:3.12-slim
    working_dir: /app
    command: sh -lc "pip install -r requirements-v4.txt && python run_server.py --worker-supervisor --tenant local-workspace --roles chief,planner,architect,frontend,backend,qa,security,integration,release"
    environment:
      V4_DATABASE_URL: postgresql+psycopg://orchestrator:orchestrator@postgres:5432/orchestrator
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - .:/app
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    volumes:
      - v4-postgres:/var/lib/postgresql/data

volumes:
  v4-postgres:
